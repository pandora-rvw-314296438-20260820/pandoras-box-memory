# Native Operations-only entrypoint; authenticates actual Vercel OIDC inside the function.
# Do not deploy the historical full index.ts route catalogue under this release.
[functions.pandora-memory-bridge]
verify_jwt = false
entrypoint = "./functions/pandora-memory-bridge/operations-entrypoint.ts"

[functions.pandora-memory-search]
verify_jwt = false
entrypoint = "./functions/pandora-memory-search/index.ts"
