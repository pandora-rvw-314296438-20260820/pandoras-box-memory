name: Visible Memory Format Once

on:
  push:
    branches:
      - visible/memory-evidence-convergence-20260902

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: visible/memory-evidence-convergence-20260902
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.4.3
      - name: Canonical Deno format and self-remove
        shell: bash
        run: |
          set -euo pipefail
          deno fmt supabase/functions/pandora-projectos-learning/index.ts
          rm .github/workflows/visible-memory-format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/pandora-projectos-learning/index.ts .github/workflows/visible-memory-format-once.yml
          git commit -m "style(memory): canonical format visible lifecycle intake"
          git push origin HEAD:visible/memory-evidence-convergence-20260902
