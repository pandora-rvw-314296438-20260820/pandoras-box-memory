
name: Temporary learning formatter probe
on:
  push:
    branches:
      - chat-c/recover-learning-v3-source-20260901-2237
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.4.3
      - name: Emit exact formatted source
        run: |
          set -euo pipefail
          deno fmt supabase/functions/pandora-projectos-learning/index.ts
          echo 'FORMATTED_BASE64_BEGIN'
          base64 -w0 supabase/functions/pandora-projectos-learning/index.ts
          echo
          echo 'FORMATTED_BASE64_END'
