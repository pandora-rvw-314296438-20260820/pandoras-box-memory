
name: Temporary learning formatter repair
on:
  push:
    branches:
      - chat-c/recover-learning-v3-source-20260901-2237
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.4.3
      - name: Apply exact Deno formatting once
        run: |
          set -euo pipefail
          deno fmt supabase/functions/pandora-projectos-learning/index.ts
          if git diff --quiet -- supabase/functions/pandora-projectos-learning/index.ts; then
            echo 'Learning source already formatted.'
            exit 0
          fi
          git config user.name 'pandora-format-bot'
          git config user.email 'pandora-format-bot@users.noreply.github.com'
          git add supabase/functions/pandora-projectos-learning/index.ts
          git commit -m 'style(memory): format learning v3 source'
          git push origin HEAD:chat-c/recover-learning-v3-source-20260901-2237
