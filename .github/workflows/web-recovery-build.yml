name: Memory recovery web build
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'supabase/functions/pandora-memory-search/**'
      - 'supabase/functions/pandora-memory-bridge/**'
      - 'ops/memory-cutover/tokyo/functions/pandora-memory-evidence/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'next-env.d.ts'
      - '.github/workflows/web-recovery-build.yml'
  push:
    branches: [recovery/deployable-web-v1]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify ProjectOS and Pandora Memory routing
        run: npm run verify:bridge-url
      - name: Verify migration authority
        run: npm run verify:migration-authority
      - name: Verify Growth Memory contract
        run: npm run verify:growth-memory-context
      - name: Verify direct Vercel Memory gateway
        run: npm run verify:vercel-memory-gateway
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ivmvufhcsezyhczzondn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
