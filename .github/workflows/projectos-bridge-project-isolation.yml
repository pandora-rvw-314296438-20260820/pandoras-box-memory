
name: ProjectOS bridge project isolation

on:
  pull_request:
    paths:
      - "supabase/functions/pandora-projectos-bridge/**"
      - "app/api/projectos/memory/search/route.ts"
      - "scripts/verify_projectos_bridge_project_scope.py"
      - "docs/capabilities/evidence/PROJECTOS_BRIDGE_PROJECT_ISOLATION_2026-09-01.md"
      - ".github/workflows/projectos-bridge-project-isolation.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/pandora-projectos-bridge/**"
      - "app/api/projectos/memory/search/route.ts"
      - "scripts/verify_projectos_bridge_project_scope.py"
      - "docs/capabilities/evidence/PROJECTOS_BRIDGE_PROJECT_ISOLATION_2026-09-01.md"
      - ".github/workflows/projectos-bridge-project-isolation.yml"

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  project-isolation:
    name: Prove exact-project bridge isolation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.4.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Prove project-scope source contract
        run: python3 scripts/verify_projectos_bridge_project_scope.py

      - name: Check route and runtime-config formatting
        run: >-
          deno fmt --check
          supabase/functions/pandora-projectos-bridge/deno.json
          app/api/projectos/memory/search/route.ts

      - name: Reject whitespace errors in the PR diff
        shell: bash
        run: |
          set -euo pipefail
          comparison_base="$BASE_SHA"
          if [[ ! "$comparison_base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${comparison_base}^{commit}" 2>/dev/null; then
            comparison_base="$(git rev-parse HEAD^)"
          fi
          git diff --check "${comparison_base}"...HEAD

      - name: Type-check the Edge Function
        run: >-
          deno check
          --config supabase/functions/pandora-projectos-bridge/deno.json
          supabase/functions/pandora-projectos-bridge/index.ts

      - name: Install exact web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check the web route
        run: npm run typecheck
