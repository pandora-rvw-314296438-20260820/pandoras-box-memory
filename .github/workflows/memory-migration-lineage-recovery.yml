name: Memory migration lineage recovery

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "docs/capabilities/evidence/MEMORY_MIGRATION_LINEAGE_RECOVERY_2026-09-01.json"
      - "docs/status/MEMORY_MIGRATION_LINEAGE_RECOVERY_2026-09-01.md"
      - "scripts/check_memory_migration_lineage_recovery.mjs"
      - ".github/workflows/memory-migration-lineage-recovery.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "docs/capabilities/evidence/MEMORY_MIGRATION_LINEAGE_RECOVERY_2026-09-01.json"
      - "docs/status/MEMORY_MIGRATION_LINEAGE_RECOVERY_2026-09-01.md"
      - "scripts/check_memory_migration_lineage_recovery.mjs"
      - ".github/workflows/memory-migration-lineage-recovery.yml"

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  lineage:
    name: Verify Memory migration source lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify migration lineage checkpoint
        run: node scripts/check_memory_migration_lineage_recovery.mjs
      - name: Scan for literal secrets
        run: bash scripts/check_no_literal_secrets.sh
