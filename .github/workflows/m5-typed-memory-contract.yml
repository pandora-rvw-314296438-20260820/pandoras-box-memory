name: M5 Typed Memory Contract

on:
  pull_request:
    paths:
      - 'supabase/migrations/**m5_typed_memory_records_v1.sql'
      - 'scripts/verify_m5_typed_memory_contract.py'
      - 'docs/architecture/M5_TYPED_MEMORY_CONTRACT.md'
      - 'docs/architecture/pandora-memory-class-contract-v1.json'
      - 'docs/capabilities/evidence/M5_001_TYPED_MEMORY_CONTRACT_2026-09-13.json'
      - '.github/workflows/m5-typed-memory-contract.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**m5_typed_memory_records_v1.sql'
      - 'scripts/verify_m5_typed_memory_contract.py'
      - 'docs/architecture/M5_TYPED_MEMORY_CONTRACT.md'
      - 'docs/architecture/pandora-memory-class-contract-v1.json'
      - 'docs/capabilities/evidence/M5_001_TYPED_MEMORY_CONTRACT_2026-09-13.json'
      - '.github/workflows/m5-typed-memory-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify M5 typed Memory invariants
        run: python3 scripts/verify_m5_typed_memory_contract.py
      - name: Compile verifier
        run: python3 -m py_compile scripts/verify_m5_typed_memory_contract.py
      - name: Reject literal secret material
        run: bash scripts/check_no_literal_secrets.sh
