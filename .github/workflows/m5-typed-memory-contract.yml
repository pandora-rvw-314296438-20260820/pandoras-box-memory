name: M5 Typed Memory Contract

on:
  pull_request:
    paths:
      - 'supabase/migrations/**m5_typed_memory_records_v1.sql'
      - 'scripts/verify_m5_typed_memory_contract.py'
      - 'docs/architecture/M5_TYPED_MEMORY_CONTRACT.md'
      - 'docs/architecture/pandora-memory-class-contract-v1.json'
      - 'docs/capabilities/evidence/M5_001_TYPED_MEMORY_CONTRACT_2026-09-13.json'
      - 'tests/sql/m5_typed_memory_*.sql'
      - '.github/workflows/m5-typed-memory-contract.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**m5_typed_memory_records_v1.sql'
      - 'scripts/verify_m5_typed_memory_contract.py'
      - 'docs/architecture/M5_TYPED_MEMORY_CONTRACT.md'
      - 'docs/architecture/pandora-memory-class-contract-v1.json'
      - 'docs/capabilities/evidence/M5_001_TYPED_MEMORY_CONTRACT_2026-09-13.json'
      - 'tests/sql/m5_typed_memory_*.sql'
      - '.github/workflows/m5-typed-memory-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify M5 frozen contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify M5 typed Memory invariants
        run: python3 scripts/verify_m5_typed_memory_contract.py
      - name: Compile verifier
        run: python3 -m py_compile scripts/verify_m5_typed_memory_contract.py
      - name: Reject literal secret material
        run: bash scripts/check_no_literal_secrets.sh

  postgres-migration:
    name: Prove M5 migration in disposable PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start isolated PostgreSQL 16
        run: |
          docker run -d --name m5-postgres \
            -e POSTGRES_PASSWORD=postgres \
            postgres:16
          for i in $(seq 1 30); do
            if docker exec m5-postgres pg_isready -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs m5-postgres
          exit 1
      - name: Create production-shaped disposable baseline
        run: docker exec -i m5-postgres psql -U postgres -v ON_ERROR_STOP=1 < tests/sql/m5_typed_memory_baseline.sql
      - name: Compile and apply exact M5 migration
        run: docker exec -i m5-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20260913032000_m5_typed_memory_records_v1.sql
      - name: Exercise M5 authority, correction and supersession behavior
        run: docker exec -i m5-postgres psql -U postgres -v ON_ERROR_STOP=1 < tests/sql/m5_typed_memory_behavior.sql
      - name: Stop disposable database
        if: always()
        run: docker rm -f m5-postgres >/dev/null 2>&1 || true
