name: Memory Cross-Project Generalization Gate

on:
  pull_request:
    paths:
      - "docs/verification/MEMORY_CROSS_PROJECT_GENERALIZATION_CONTRACT_2026-09-01.md"
      - "docs/capabilities/evidence/MEMORY_CROSS_PROJECT_GENERALIZATION_BASELINE_2026-09-01.json"
      - "scripts/verify_memory_cross_project_generalization.mjs"
      - ".github/workflows/memory-cross-project-generalization-gate.yml"
      - "supabase/functions/pandora-projectos-bridge/**"
      - "scripts/verify_projectos_bridge_project_scope.py"
      - "scripts/check_no_literal_secrets.sh"
  push:
    branches: [main]
    paths:
      - "docs/verification/MEMORY_CROSS_PROJECT_GENERALIZATION_CONTRACT_2026-09-01.md"
      - "docs/capabilities/evidence/MEMORY_CROSS_PROJECT_GENERALIZATION_BASELINE_2026-09-01.json"
      - "scripts/verify_memory_cross_project_generalization.mjs"
      - ".github/workflows/memory-cross-project-generalization-gate.yml"
      - "supabase/functions/pandora-projectos-bridge/**"

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  cross-project-zero-leakage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify cross-project privacy and governance contract
        run: node scripts/verify_memory_cross_project_generalization.mjs

      - name: Re-prove exact-project source isolation
        run: python3 scripts/verify_projectos_bridge_project_scope.py

      - name: Run literal-secret source gate
        run: bash scripts/check_no_literal_secrets.sh

      - name: Require source-only PR scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed
          closure_packet=true
          for marker in "docs/verification/MEMORY_CROSS_PROJECT_GENERALIZATION_CONTRACT_2026-09-01.md" "docs/capabilities/evidence/MEMORY_CROSS_PROJECT_GENERALIZATION_BASELINE_2026-09-01.json" "scripts/verify_memory_cross_project_generalization.mjs"; do
            if ! grep -Fxq "$marker" /tmp/changed; then closure_packet=false; fi
          done
          if [[ "$closure_packet" != true ]]; then
            echo "Cross-project runtime tests passed; strict Chat C closure-file scope is not applicable to this PR."
            exit 0
          fi
          allowed='^(\.github/workflows/(learning-intelligence-contract|memory-hardening-readiness|memory-security-adjudication-gate|memory-lifecycle-contract-gate|memory-quality-observability-gate|memory-cross-project-generalization-gate)\.yml|docs/capabilities/evidence/(LEARNING_INTELLIGENCE_CONTRACT_2026-09-01\.md|MEMORY_HARDENING_READINESS_2026-09-01\.json|MEMORY_SECURITY_ADJUDICATION_2026-09-01\.json|MEMORY_LIFECYCLE_CONSOLIDATION_CONTRACT_2026-09-01\.md|MEMORY_LIFECYCLE_LIVE_EVIDENCE_2026-09-01\.json|MEMORY_QUALITY_OBSERVABILITY_BASELINE_2026-09-01\.json|MEMORY_CROSS_PROJECT_GENERALIZATION_BASELINE_2026-09-01\.json)|docs/security/MEMORY_SECURITY_ADJUDICATION_CONTRACT_2026-09-01\.md|docs/observability/MEMORY_QUALITY_OBSERVABILITY_CONTRACT\.md|docs/verification/MEMORY_CROSS_PROJECT_GENERALIZATION_CONTRACT_2026-09-01\.md|scripts/(verify_learning_intelligence_contract\.py|verify_memory_hardening_readiness\.py|verify_memory_security_adjudication\.py|verify_memory_lifecycle_contract\.py|verify_memory_quality_observability\.py|verify_memory_cross_project_generalization\.mjs))$'
          if grep -Ev "$allowed" /tmp/changed; then
            echo "::error::Chat C closure PR contains runtime, migration, or unrelated files."
            exit 1
          fi
          for required in ".github/workflows/memory-cross-project-generalization-gate.yml" "docs/verification/MEMORY_CROSS_PROJECT_GENERALIZATION_CONTRACT_2026-09-01.md" "docs/capabilities/evidence/MEMORY_CROSS_PROJECT_GENERALIZATION_BASELINE_2026-09-01.json" "scripts/verify_memory_cross_project_generalization.mjs"; do
            grep -Fxq "$required" /tmp/changed || { echo "::error::missing required cross-project gate file: $required"; exit 1; }
          done
