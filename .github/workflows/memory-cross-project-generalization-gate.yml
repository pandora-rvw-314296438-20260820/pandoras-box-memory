name: Memory Cross-Project Generalization Gate

on:
  pull_request:
    paths:
      - "docs/verification/MEMORY_CROSS_PROJECT_GENERALIZATION_CONTRACT_2026-09-01.md"
      - "docs/capabilities/evidence/MEMORY_CROSS_PROJECT_GENERALIZATION_BASELINE_2026-09-01.json"
      - "scripts/verify_memory_cross_project_generalization.mjs"
      - ".github/workflows/memory-cross-project-generalization-gate.yml"
      - "supabase/functions/pandora-projectos-bridge/**"
      - "scripts/verify_projectos_bridge_project_scope.py"
      - "scripts/check_no_literal_secrets.sh"
  push:
    branches: [main]
    paths:
      - "docs/verification/MEMORY_CROSS_PROJECT_GENERALIZATION_CONTRACT_2026-09-01.md"
      - "docs/capabilities/evidence/MEMORY_CROSS_PROJECT_GENERALIZATION_BASELINE_2026-09-01.json"
      - "scripts/verify_memory_cross_project_generalization.mjs"
      - ".github/workflows/memory-cross-project-generalization-gate.yml"
      - "supabase/functions/pandora-projectos-bridge/**"

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  cross-project-zero-leakage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify cross-project privacy and governance contract
        run: node scripts/verify_memory_cross_project_generalization.mjs

      - name: Re-prove exact-project source isolation
        run: python3 scripts/verify_projectos_bridge_project_scope.py

      - name: Run literal-secret source gate
        run: bash scripts/check_no_literal_secrets.sh

      - name: Require source-only PR scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/memory-cross-project-generalization-gate\.yml|docs/verification/MEMORY_CROSS_PROJECT_GENERALIZATION_CONTRACT_2026-09-01\.md|docs/capabilities/evidence/MEMORY_CROSS_PROJECT_GENERALIZATION_BASELINE_2026-09-01\.json|scripts/verify_memory_cross_project_generalization\.mjs)$'
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed
          if grep -Ev "$allowed" /tmp/changed; then
            echo "::error::Cross-project generalization readiness PR contains runtime, migration, or unrelated files."
            exit 1
          fi
          test "$(wc -l < /tmp/changed | tr -d ' ')" -eq 4
