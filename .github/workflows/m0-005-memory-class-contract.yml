name: M0-005 Memory Class Contract

on:
  pull_request:
    paths:
      - 'docs/architecture/pandora-memory-class-contract-v1.json'
      - 'docs/architecture/M0_005_MEMORY_CLASS_CONTRACT.md'
      - 'scripts/verify_m0_005_memory_class_contract.py'
      - '.github/workflows/m0-005-memory-class-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/architecture/pandora-memory-class-contract-v1.json'
      - 'docs/architecture/M0_005_MEMORY_CLASS_CONTRACT.md'
      - 'scripts/verify_m0_005_memory_class_contract.py'
      - '.github/workflows/m0-005-memory-class-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen Memory class contract
        run: python3 scripts/verify_m0_005_memory_class_contract.py
      - name: Compile verifier
        run: python3 -m py_compile scripts/verify_m0_005_memory_class_contract.py
      - name: Reject obvious literal secret material
        shell: bash
        run: |
          if grep -ERn '(sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9_]{20,})'             docs/architecture/pandora-memory-class-contract-v1.json             docs/architecture/M0_005_MEMORY_CLASS_CONTRACT.md             scripts/verify_m0_005_memory_class_contract.py             .github/workflows/m0-005-memory-class-contract.yml; then
            echo 'Potential literal secret material found'
            exit 1
          fi
